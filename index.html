<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portion Pro Spoon - The Gadget Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>The Gadget Shop</h1>
    <p>Precision Kitchen Tools for Everyone</p>
  </header>

  <main class="main-container">

    <!-- Product Card -->
    <section class="product-card">
      <div class="carousel-container">
        <div class="carousel">
          <img src="https://image2url.com/r2/default/images/1768743117712-9eefc32c-e80a-40ed-a4c3-4148209909f0.jpg" alt="Portion Pro Spoon">
          <img src="https://image2url.com/r2/default/images/1768742710946-f0044673-0d97-4305-b659-09bae189d612.jpg" alt="Portion Pro Spoon">
          <img src="https://image2url.com/r2/default/images/1768742576958-e1ca3189-1e1c-404e-9b2d-20151c5d2ef6.jpg" alt="Portion Pro Spoon">
          <img src="https://image2url.com/r2/default/images/1768743724018-46faa866-2672-4ea8-8575-cb336428f77f.jpg" alt="Portion Pro Spoon">
        </div>
      </div>

      <div class="product-info">
        <h2>Portion Pro Spoon</h2>
        <p>High-precision measuring spoon, up to 500g, perfect for baking and cooking. Easy-to-read LCD display, compact and detachable for easy cleaning.</p>
        <p class="price">Price: $<span id="product-price">45</span></p>

        <input type="text" id="coupon-code" placeholder="Enter coupon code">
        <p class="coupon-feedback" id="coupon-feedback"></p>

        <button id="buy-now">Buy Now</button>
      </div>
    </section>
  </main>

  <!-- Form Popup -->
  <div class="form-popup" id="order-form-popup">
    <form id="order-form">
      <h3>Complete Your Order</h3>
      <p>All fields are required.</p>

      <label>Full Name</label>
      <input type="text" name="fullName" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Phone Number</label>
      <input type="text" name="phone" required>

      <label>Address</label>
      <input type="text" name="address" required>

      <label>City</label>
      <input type="text" name="city" required>

      <label>Postal Code</label>
      <input type="text" name="postalCode" required>

      <label>Country</label>
      <input type="text" name="country" required>

      <label>Order ID</label>
      <input type="text" id="order-id" name="orderId" readonly required>

      <button type="submit">Proceed to PayPal</button>
      <button type="button" id="close-form">Cancel</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
  </html>
