<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portion Pro Spoon</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #111827;
  --muted: #6b7280;
  --accent: #2563eb;
  --border: #e5e7eb;
}

* {
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

/* ===== PAGE ===== */
.page {
  max-width: 420px;
  margin: auto;
  padding: 20px;
  animation: fadeIn 0.8s ease;
}

/* ===== PRODUCT CARD ===== */
.card {
  background: var(--card);
  border-radius: 28px;
  padding: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.06);
}

/* ===== IMAGE CAROUSEL ===== */
.carousel {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  border-radius: 20px;
}

.carousel img {
  width: 100%;
  flex-shrink: 0;
  scroll-snap-align: center;
  border-radius: 20px;
}

/* ===== TEXT ===== */
h1 {
  font-size: 22px;
  margin: 16px 0 6px;
}

p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
}

/* ===== PRICE ===== */
.price {
  font-size: 26px;
  font-weight: 700;
  margin: 16px 0;
}

.old {
  font-size: 14px;
  color: #9ca3af;
  text-decoration: line-through;
}

/* ===== COLOR SELECT ===== */
.colors {
  display: flex;
  gap: 10px;
  margin: 14px 0;
}

.color {
  padding: 10px 14px;
  border-radius: 14px;
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 13px;
}

.color.active {
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}

/* ===== BUNDLE ===== */
.bundle {
  display: none;
  margin-top: 14px;
  padding: 12px;
  border-radius: 14px;
  background: #eff6ff;
  font-size: 13px;
}

/* ===== BUTTON ===== */
.buy {
  width: 100%;
  padding: 16px;
  margin-top: 18px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

/* ===== MODAL ===== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  width: 90%;
  max-width: 420px;
  border-radius: 24px;
  padding: 20px;
  animation: slideUp 0.4s ease;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 12px;
  border: 1px solid var(--border);
  font-size: 14px;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
  .color-circle {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background-size: cover;
  background-position: center;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.2s ease, border 0.2s ease;
}

.color-circle.active {
  border-color: var(--accent);
  transform: scale(1.05);
}

/* Bundle animation */
.bundle.slide {
  animation: slideIn 0.4s ease forwards;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body>

<div class="page">
  <div class="card">

    <div class="carousel">
      <img src="https://image2url.com/r2/default/images/1768743117712-9eefc32c-e80a-40ed-a4c3-4148209909f0.jpg">
      <img src="https://image2url.com/r2/default/images/1768742710946-f0044673-0d97-4305-b659-09bae189d612.jpg">
      <img src="https://image2url.com/r2/default/images/1768742576958-e1ca3189-1e1ca3189-1e1c-404e-9b2d-20151c5d2ef6.jpg">
      <img src="https://image2url.com/r2/default/images/1768742487363-7f8e0131-03ab-492a-983d-0d8c6303904b.jpg">
    </div>

    <h1>Portion Pro Spoon</h1>
    <p>Precision digital measuring spoon for accurate cooking, baking and nutrition tracking.</p>

<div class="price">
  <span id="price">$23</span>
  <div class="old">$45</div>
</div>

<p
  id="couponStatus"
  style="display:none;font-size:13px;color:#2e7dff;margin-top:6px;"
>
  Coupon Applied ✓
        </p>
<div
  id="bundle"
  style="
    display:none;
    margin-top:14px;
    animation:slideUp .35s ease;
  "
>
  <p style="font-size:14px;font-weight:600;">
    🎁 Free Bundle Included
  </p>

  <div style="display:flex;gap:10px;margin-top:8px;">
    <img src="bundle1.jpg" width="60">
    <img src="bundle2.jpg" width="60">
    <img src="bundle3.jpg" width="60">
  </div>
  </div>
    <div class="bundle" id="bundle">
      🎁 Bonus Peeler included — courtesy of your creator
    </div>
<!-- COUPON INPUT -->
<input
  id="couponInput"
  placeholder="Have a coupon?"
  oninput="applyCoupon(this.value)"
  style="
    width:100%;
    padding:12px;
    border-radius:14px;
    border:1px solid var(--border);
    font-size:14px;
    margin-top:14px;
  "
>

<div
  id="couponStatus"
  style="
    display:none;
    margin-top:8px;
    font-size:13px;
    color:#16a34a;
    font-weight:600;
  "
>
  Coupon Applied ✓
  </div>
    <button class="buy" onclick="openForm()">Buy Now</button>
  </div>
</div>

<!-- FORM MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Shipping Details</h3>
<!-- COLOR SELECTION -->
<label style="margin-top:12px; display:block; font-weight:600;">Choose Color</label>

<div style="display:flex; gap:14px; margin-top:10px;">
  <div class="color-circle" id="color-Dark Green"
       onclick="selectColor('Dark Green')"
       style="background-image:url('https://image2url.com/r2/default/images/1768743117712-9eefc32c-e80a-40ed-a4c3-4148209909f0.jpg');"></div>

  <div class="color-circle" id="color-Light Green"
       onclick="selectColor('Light Green')"
       style="background-image:url('https://image2url.com/r2/default/images/1768742710946-f0044673-0d97-4305-b659-09bae189d612.jpg');"></div>

  <div class="color-circle" id="color-Black"
       onclick="selectColor('Black')"
       style="background-image:url('https://image2url.com/r2/default/images/1768742487363-7f8e0131-03ab-492a-983d-0d8c6303904b.jpg');"></div>
</div>

<input type="hidden" name="color" id="formColor">
<input type="hidden" name="coupon" id="formCoupon">
    <form action="https://formspree.io/f/mjgggjek" method="POST" onsubmit="redirectPayPal()">
      <input type="hidden" name="order_id" id="order_id">
      <input type="hidden" name="final_price" id="final_price">

      <input required name="name" placeholder="Full Name">
      <input required name="address" placeholder="Street Address">
      <input required name="city" placeholder="City">
      <input required name="country" placeholder="Country">
      <input required name="email" placeholder="Email">
      <input name="coupon" placeholder="Coupon (optional)" oninput="applyCoupon(this.value)">

      <button class="buy" type="submit">Complete Order</button>
    </form>
  </div>
</div>

<script>
let selectedColor = null;
let price = 45;

document.getElementById("order_id").value =
  "ORD-" + Math.random().toString(36).substr(2,6).toUpperCase();

function selectColor(el) {
  document.querySelectorAll('.color').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedColor = el.innerText;
}

function openForm() {
  if (!selectedColor) {
    alert("Please select a color");
    return;
  }
  document.getElementById("modal").style.display = "flex";
}

<script>
let price = 45;
let selectedColor = "";
let couponUsed = "";

/* ===== ORDER ID ===== */
document.getElementById("order_id").value =
  "ORD-" + Math.random().toString(36).substr(2,6).toUpperCase();

/* ===== COLOR SELECT ===== */
function selectColor(color) {
  document.querySelectorAll(".color-circle")
    .forEach(c => c.classList.remove("active"));

  document.getElementById("color-" + color).classList.add("active");
  selectedColor = color;
  document.getElementById("formColor").value = color;
}

/* ===== OPEN FORM ===== */
function openForm() {
  if (!selectedColor) {
    alert("Please select a color");
    return;
  }
  document.getElementById("modal").style.display = "flex";
}

/* ===== COUPON LOGIC ===== */
function applyCoupon(code) {
  code = code.trim().toUpperCase();

  const priceEl = document.getElementById("price");
  const bundle = document.getElementById("bundle");
  const status = document.getElementById("couponStatus");

  if (code === "LIMITED23" || code === "INFLUENCER50") {
    price = 29;
    couponUsed = code;

    priceEl.innerText = "$29";
    bundle.style.display = "block";
    bundle.classList.add("slide");
    status.style.display = "block";

    document.getElementById("formCoupon").value = code;
  } else {
    price = 45;
    couponUsed = "";

    priceEl.innerText = "$45";
    bundle.style.display = "none";
    status.style.display = "none";

    document.getElementById("formCoupon").value = "";
  }
}

/* ===== PAYPAL REDIRECT ===== */
function redirectPayPal() {
  document.getElementById("final_price").value = price;

  setTimeout(() => {
    window.location.href =
      "https://paypal.me/BuynowPortionprospoo/" + price;
  }, 600);
}
</script>

</body>
  </html>
