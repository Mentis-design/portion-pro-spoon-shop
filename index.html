<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portion Pro Spoon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Portion Pro Spoon</h1>
</header>

<main>

  <section class="carousel-container">
    <div class="carousel">
      <img src="https://image2url.com/r2/default/images/1768743117712-9eefc32c-e80a-40ed-a4c3-4148209909f0.jpg" alt="Portion Pro Spoon">
      <img src="https://image2url.com/r2/default/images/1768742710946-f0044673-0d97-4305-b659-09bae189d612.jpg" alt="Portion Pro Spoon">
      <img src="https://image2url.com/r2/default/images/1768742576958-e1ca3189-1e1c-404e-9b2d-20151c5d2ef6.jpg" alt="Portion Pro Spoon">
      <img src="https://image2url.com/r2/default/images/1768742487363-7f8e0131-03ab-492a-983d-0d8c6303904b.jpg" alt="Portion Pro Spoon">
      <img src="https://image2url.com/r2/default/images/1768743724018-46faa866-2672-4ea8-8575-cb336428f77f.jpg" alt="Peeler Bundle">
    </div>
  </section>

  <section class="product-info">
    <p class="price">Price: <span id="price">$45</span></p>
    <input type="text" id="coupon" placeholder="Enter coupon code">
    <button id="buyBtn">Buy Now</button>
  </section>

</main>

<!-- Popup Form -->
<div id="formPopup" class="form-popup">
  <form id="orderForm">
    <h2>Shipping Information</h2>
    <label>Order ID <span id="orderId"></span></label>
    <input type="text" id="orderIdInput" name="orderId" readonly required>

    <label>First Name</label>
    <input type="text" name="firstName" required>

    <label>Last Name</label>
    <input type="text" name="lastName" required>

    <label>Address</label>
    <input type="text" name="address" required>

    <label>City</label>
    <input type="text" name="city" required>

    <label>ZIP / Postal Code</label>
    <input type="text" name="zip" required>

    <label>Country</label>
    <input type="text" name="country" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <button type="submit">Proceed to PayPal</button>
  </form>
</div>

<script src="script.js"></script>
</body>
  </html>
