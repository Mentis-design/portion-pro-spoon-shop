<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portion Pro Spoon - The Gadget Shop</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Portion Pro Spoon 🍴</h1>
    <p>High precision kitchen measuring spoon</p>
  </header>

  <!-- Image carousel -->
  <div class="carousel">
    <button class="prev" onclick="prevImage()">&#10094;</button>
    <img id="carouselImage" src="https://image2url.com/r2/default/images/1768647034317-2da33fef-d189-4b40-90cf-e88fb9e3909f.jpg" alt="Portion Pro Spoon">
    <button class="next" onclick="nextImage()">&#10095;</button>
  </div>

  <!-- Coupon info -->
  <div class="coupon-container">
    <label for="couponCode">Have a coupon?</label>
    <input type="text" id="couponCode" placeholder="Enter code">
    <button onclick="applyCoupon()">Apply</button>
    <p id="couponMessage"></p>
  </div>

  <!-- Price display -->
  <div class="price">
    Price: $<span id="price">45</span>
  </div>

  <!-- PayPal button -->
  <div class="paypal">
    <a id="paypalButton" href="https://www.paypal.me/BuynowPortionprospoo" target="_blank">Pay Now</a>
  </div>

  <!-- Order form -->
  <form action="https://formspree.io/f/mjgggjek" method="POST" id="orderForm">
    <h2>Order Details</h2>
    <label>Order ID (auto-generated)</label>
    <input type="text" name="orderID" id="orderID" readonly required>

    <label>First Name</label>
    <input type="text" name="firstName" required>

    <label>Last Name</label>
    <input type="text" name="lastName" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Shipping Address</label>
    <input type="text" name="address" required>

    <label>City</label>
    <input type="text" name="city" required>

    <label>ZIP / Postal Code</label>
    <input type="text" name="zip" required>

    <label>Country</label>
    <input type="text" name="country" required>

    <label>PayPal Email (for payment)</label>
    <input type="email" name="paypalEmail" required>

    <button type="submit">Submit Order</button>
  </form>

  <!-- Thank you message placeholder -->
  <div id="thankYouMessage" style="display:none;">
    <h2>Thank you for your order!</h2>
    <p>Your order has been submitted. You will receive tracking once your package is ready to ship.</p>
  </div>
</body>
  </html>
